bundle:
  name: databricks-first-app

resources:
  apps:
    claude-chat:
      name: claude-chat
      description: "Streamlit chat app powered by the claude_45 serving endpoint"
      git_source:
        git_url: https://github.com/O-Faraday/databricks_first_app
        git_branch: main
      resources:
        - name: claude-serving-endpoint
          serving_endpoint:
            name: claude_45
            permission: CAN_QUERY
      config:
        command:
          - streamlit
          - run
          - app.py
          - --server.port
          - "${DATABRICKS_APP_PORT:-8000}"
          - --server.address
          - "0.0.0.0"
        env:
          - name: STREAMLIT_SERVER_ENABLE_CORS
            value: "false"
          - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
            value: "false"
          - name: SERVING_ENDPOINT
            value: "claude_45"

targets:
  dev:
    default: true
