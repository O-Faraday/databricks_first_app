bundle:
  name: databricks-first-app

variables:
  serving_endpoint_name:
    default: databricks-gpt-oss-120b
    description: "Nom du serving endpoint du modèle"

resources:
  apps:
    claude-chat:
      name: claude-chat
      description: "Streamlit chat app powered by the claude_45 serving endpoint"
      git_repository:
        url: https://github.com/O-Faraday/databricks_first_app
        provider: gitHub
      git_source:
        branch: main
      resources:
        - name: claude-serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY

targets:
  dev:
    default: true